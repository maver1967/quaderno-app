<!doctype html>
<html lang="it" data-tema="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Quaderno</title>
<meta name="description" content="Note e database personali.">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quaderno">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<link rel="stylesheet" href="stile.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
</head>
<body>
<div id="app">
  <nav id="sidebar" aria-label="Navigazione"></nav>
  <div id="velo"></div>
  <main id="principale">
    <div class="briciole" id="briciole">
      <button id="apri-sidebar" aria-label="Apri il menu">☰</button>
      <div id="briciole-voci" style="display:flex;align-items:center;gap:6px"></div>
    </div>
    <div id="contenuto"></div>
  </main>
</div>
<script type="module" src="app.js"></script>
<script>
  // Il service worker rende l'app installabile e apribile senza rete.
  // Se non c'e' (http, browser vecchio) l'app funziona lo stesso.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
